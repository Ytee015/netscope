{% extends 'base.html' %}

{% block title %}Login - NETSCOPE{% endblock %}

{% block content %}
<div class="auth-layout">
  <div class="auth-card glass-card">
    <div class="auth-header">
      <div class="brand-lockup">
        <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="NETSCOPE logo" class="login-logo">
        <span>NETSCOPE</span>
      </div>
      <h2>Welcome back</h2>
      <p>Choose your role and sign in</p>
    </div>
    <div class="role-picker" aria-label="Choose a role">
      <button type="button" class="role-option {% if selected_role == 'admin' %}active{% endif %}" data-role="admin">
        <i class="bi bi-shield-lock"></i>
        <span>Admin</span>
      </button>
      <button type="button" class="role-option {% if selected_role == 'staff' or not selected_role %}active{% endif %}" data-role="staff">
        <i class="bi bi-people"></i>
        <span>Staff</span>
      </button>
      <button type="button" class="role-option {% if selected_role == 'technician' %}active{% endif %}" data-role="technician">
        <i class="bi bi-tools"></i>
        <span>Technician</span>
      </button>
    </div>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" id="loginRole" name="role" value="{{ selected_role or 'admin' }}">
      <div class="mb-3">
        <label for="identifier" class="form-label">Username or Email</label>
        <input type="text" class="form-control" id="identifier" name="identifier" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <div class="auth-links">
      <span>Need an account?</span>
      <a href="{{ url_for('auth.register') }}">Create account</a>
    </div>
  </div>
</div>
{% endblock %}
