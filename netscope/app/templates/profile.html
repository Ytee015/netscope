{% extends 'base.html' %}

{% block title %}Profile - NETSCOPE{% endblock %}

{% block content %}
<div class="section-header">
  <h2>Profile</h2>
</div>

<div class="row g-4">
  <div class="col-lg-6">
    <div class="glass-card page-card">
      <h4>Account details</h4>
      <ul class="list-group list-group-flush profile-list">
        <li class="list-group-item"><strong>Username:</strong> {{ user.username }}</li>
        <li class="list-group-item"><strong>Email:</strong> {{ user.email }}</li>
        <li class="list-group-item"><strong>Role:</strong> {{ user.role|title }}</li>
        <li class="list-group-item"><strong>Created:</strong> {{ user.created_at.strftime('%Y-%m-%d %H:%M') }}</li>
      </ul>
    </div>
  </div>
</div>
{% endblock %}
